[package]
name = "shugu-forge"
version = "0.1.0"
description = "Shugu Forge — desktop workshop (Tauri 2 / React / CodeMirror 6)"
edition = "2021"
rust-version = "1.77"

[lib]
name = "shugu_forge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
walkdir = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
rusqlite = { version = "0.32", features = ["bundled"] }
# UUID v4 for agent identifiers — agents.rs uses Uuid::new_v4() to mint
# stable IDs that the frontend can dedupe events against. v4 is random
# (no MAC leak), 128-bit collision-free for our scale, and matches the
# format the Tauri event bus already serializes through serde transparently.
uuid = { version = "1", features = ["v4"] }
sqlite-vec = "0.1"
fastembed = "4"
# SHA256 streaming for model_bundle.rs (download verification).
# RustCrypto family — pure-Rust, no system OpenSSL dep, identical wire
# output to coreutils' `sha256sum` for cross-checking against HuggingFace
# release pages.
sha2 = "0.10"
notify = "6"
portable-pty = "0.8"
which = "6"

# Frontmatter parser pour les définitions d'agents/skills au format
# Claude Code (.md avec en-tête YAML). gray_matter sépare frontmatter et
# body ; serde_yaml fait la (dé)sérialisation typée du frontmatter via les
# structs du module commands::agent_defs.
gray_matter = "0.2"
serde_yaml = "0.9"

# Git read-side ops (status, log, blame, diff) via libgit2 bindings.
# `vendored-libgit2` bundle libgit2 — pas de dep système. NE PAS activer
# `vendored-openssl` : sur Windows libgit2 utilise Schannel par défaut, et
# Shugu Forge ne fait JAMAIS de HTTPS via git2 (push/pull/fetch passent
# par `git` CLI pour respecter les hooks/credentials/config locales).
# Économie : pas de perl-strawberry requis pour le build MSVC.
git2 = { version = "0.19", default-features = false, features = ["vendored-libgit2"] }

# Find-in-files (LOT 2) — ripgrep en mode librairie.
#   - `ignore` : walker qui respecte .gitignore, .ignore, et les globs custom.
#               C'est le même walker que ripgrep utilise en CLI.
#   - `grep-searcher` : moteur de recherche line-oriented, avec sink callback.
#   - `grep-regex` : matcher regex (PCRE-like sans PCRE — uses Rust regex crate).
#   - `regex` : pour `regex::escape()` quand l'utilisateur cherche du texte
#               littéral (non-regex mode). Déjà transitif via grep-regex mais
#               on l'expose explicitement pour clarté.
ignore = "0.4"
grep-regex = "0.1"
grep-searcher = "0.1"
regex = "1"

# LOT 3 — LSP file:// URI percent-encoding (rust-analyzer/pylsp rejettent les
# URI avec espaces ou caractères non-ASCII non-encodés, fréquent sur des
# chemins Windows type `C:\Users\Jean Côté\OneDrive\...`).
percent-encoding = "2"

# Lot C — client MCP (Model Context Protocol). SDK Rust officiel `rmcp`.
# Version "1" pour prendre la lignée 1.x (1.7.x à ce jour) ; cargo résout le
# patch. Features RÉELLEMENT retenues (vérifiées contre rmcp 1.7 — voir le
# message d'erreur cargo qui liste les features valides si l'une bouge) :
#   client : rôle client — on CONSOMME des serveurs MCP, on n'en est pas un.
#   transport-child-process : lance un serveur MCP local en sous-process (stdio).
#   transport-streamable-http-client-reqwest : serveurs MCP distants (HTTP
#     streamable/SSE). La variante `-reqwest` (et NON le `transport-streamable-
#     http-client` nu) est REQUISE en rmcp 1.7 : c'est elle qui tire `reqwest` et
#     expose `StreamableHttpClientTransport::from_uri(..)` + le re-export crate-root
#     (vérifié contre rmcp-1.7.0/src/transport.rs + streamable_http_client.rs).
rmcp = { version = "1", features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"] }

# Lot capture d'écran (commands/capture.rs) — bouton 📷 du composer + outil
# agent de vérification visuelle.
#   xcap  : capture multi-moniteurs DPI-aware (successeur maintenu de la
#           crate `screenshots`, même auteur). Capture synchrone →
#           spawn_blocking côté command.
#   image : resize (grand côté ≤ 1568 px) + encodage JPEG q80 avant l'envoi
#           au modèle vision. Même lignée 0.25 que celle utilisée par xcap
#           (les RgbaImage passent d'une crate à l'autre sans conversion).
xcap = "0.9.6"
image = "0.25.6"

# Lane 6 — import MCP multi-source. Le parseur TOML lit (en lecture seule) le
# `~/.codex/config.toml` de Codex (`[mcp_servers.*]`). Version "0.8" déjà
# résolue dans Cargo.lock (dep transitive) → ajout direct sans nouvelle
# résolution. On lit via `toml::Value` (pas de derive) pour tolérer les champs
# inconnus de la config Codex (model, plugins, projects, marketplaces…).
toml = "0.8"

# keyring v3 has NO default features — without an explicit platform feature
# it compiles but provides no real backend (a fall-through "sample" store
# that silently accepts writes and reads but never persists across processes).
# This was the root cause of "I saved a Mistral key, switched tab, came back,
# the card was empty". Features must be declared per-OS so the same crate
# resolves to the right native backend on each platform.
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
# Junction NTFS pour lier `.shugu/agents` → `.claude/agents` sans demander
# de privilèges (contrairement aux symlinks Windows qui exigent le mode
# développeur ou UAC). Côté Unix on utilise `std::os::unix::fs::symlink`.
junction = "1"
# Job Object FFI (agents/exec.rs) — un timeout/kill du processus parent NE
# tue PAS ses descendants sur Windows (un `cargo test` lance rustc, un dev
# server lance node…). On assigne l'enfant à un Job Object configuré
# `KILL_ON_JOB_CLOSE` : fermer le handle du Job (ou TerminateJobObject)
# tue TOUTE l'arborescence d'un coup. `windows-sys` 0.59 est déjà dans
# l'arbre de dépendances (tiré transitivement) — pas de nouveau download.
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    # `CreateJobObjectW` takes `*const SECURITY_ATTRIBUTES` in its signature,
    # which lives behind `Win32_Security` — required for the JobObjects fns to
    # resolve even though we pass a null attrs pointer. `Win32_Security` also
    # carries the token/SID/ACE primitives the exec sandbox uses
    # (CreateRestrictedToken family, GetTokenInformation, GetLengthSid, the
    # ACE_FLAGS inheritance constants, TOKEN_USER / PSID / ACL types).
    "Win32_Security",
    # Exec sandbox (agents/sandbox.rs) — the ACL builder/applier:
    #   * `Win32_Security_Authorization` → Get/SetNamedSecurityInfoW,
    #     SetEntriesInAclW, EXPLICIT_ACCESS_W / TRUSTEE_W, SE_FILE_OBJECT and the
    #     DENY_ACCESS / TRUSTEE_IS_* constants used to deny-fence secret stores
    #     and write-confine out-of-workspace paths.
    #   * `Win32_Storage_FileSystem` → FILE_GENERIC_READ / FILE_GENERIC_WRITE /
    #     DELETE access masks composed into the deny ACEs.
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["linux-native-sync-persistent"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
